<style>
:root{--bg:#EEF1F4;--surface:#fff;--ink:#1B2430;--ink-soft:#5B6675;--sidebar:#101826;--sidebar-text:#C9D1DB;--sidebar-text-dim:#7C8698;--accent:#B8862B;--accent-soft:#F3E7CE;--ok:#2E7D5B;--ok-soft:#DFF0E7;--danger:#B3432B;--danger-soft:#F6E1DA;--info:#2E5FA3;--info-soft:#DDE8F6;--border:#DDE2E8;--radius:10px}
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;font-family:Vazirmatn,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);direction:rtl}button,input,textarea,select{font-family:inherit}
.login-wrap,.blocked-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#101826,#182234)}
.login-card,.blocked-card{background:#fff;width:100%;max-width:420px;border-radius:16px;padding:34px 30px;box-shadow:0 30px 60px #0006}
.login-brand,.brand{display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#B8862B,#8f6a20);flex:none}
.login-brand span{font-weight:800;font-size:19px}.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 26px}.field{margin-bottom:16px;flex:1;min-width:180px}.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600}.field input,.field textarea,.field select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;background:#fbfcfd;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:8px;border:0;font-weight:700;font-size:14px;cursor:pointer}.btn:active{transform:scale(.98)}.btn-block{width:100%}.btn-sm{padding:6px 12px;font-size:12px}.btn-primary{background:var(--ink);color:#fff}.btn-gold{background:var(--accent);color:#fff}.btn-ok{background:var(--ok);color:#fff}.btn-danger{background:var(--danger);color:#fff}.btn-info{background:var(--info);color:#fff}.btn-ghost{background:#fff;color:var(--ink-soft);border:1.5px solid var(--border)}
.error-box{background:var(--danger-soft);color:var(--danger);padding:10px 12px;border-radius:8px;margin-bottom:16px;font-size:13px}
.shell{display:flex;min-height:100vh}.sidebar{width:245px;flex:none;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;padding:20px 15px}.sidebar .brand{padding:0 6px 20px;border-bottom:1px solid #fff1;margin-bottom:15px}.sidebar .brand b{font-size:15px}.role-tag{font-size:11px;color:var(--sidebar-text-dim);background:#fff0;padding:4px 10px;border-radius:20px;margin-bottom:14px}.nav{flex:1}.nav-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;margin-bottom:4px;color:var(--sidebar-text);cursor:pointer;font-size:13.5px;font-weight:600}.nav-item:hover{background:#fff1}.nav-item.active{background:var(--accent);color:#fff}.nav-badge{background:var(--danger);color:#fff;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10px}.user-box{border-top:1px solid #fff1;padding-top:14px}.uname{font-size:12.5px;font-weight:700;color:#fff;margin-bottom:8px}.main{flex:1;padding:28px 32px;overflow:auto;min-width:0}.main-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}.main-header h2{margin:0;font-size:21px}.header-actions{display:flex;gap:8px}.icon-btn{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-size:17px}.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px}.card h4{margin:0 0 15px;font-size:15px}.row{display:flex;gap:13px;flex-wrap:wrap;align-items:flex-end}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:right}th{font-size:11.5px;color:var(--ink-soft)}tr:last-child td{border-bottom:0}.badge{display:inline-flex;padding:4px 9px;border-radius:20px;font-size:11.5px;font-weight:700}.clickable{cursor:pointer;text-decoration:underline}.badge-pending{background:var(--accent-soft);color:#7a5a17}.badge-process{background:var(--info-soft);color:var(--info)}.badge-approved,.badge-enabled{background:var(--ok-soft);color:var(--ok)}.badge-rejected,.badge-disabled{background:var(--danger-soft);color:var(--danger)}.badge-resubmit{background:#efe3f7;color:#6b3fa0}.empty-state{text-align:center;color:var(--ink-soft);padding:25px;font-size:13px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;z-index:9999;font-size:13px}.modal-backdrop{position:fixed;inset:0;background:#10182699;display:flex;align-items:center;justify-content:center;padding:20px;z-index:500}.modal-card{background:#fff;border-radius:14px;padding:25px;max-width:470px;width:100%}.modal-card h3{margin:0 0 15px}.modal-actions{display:flex;gap:9px}.modal-actions .btn{flex:1}.note-text{font-size:12px;color:var(--ink-soft)}@media(max-width:860px){.shell{flex-direction:column}.sidebar{width:100%;padding:12px;flex-direction:row;flex-wrap:wrap}.sidebar .brand{border:0;margin:0;padding:0}.role-tag{margin:0}.nav{display:flex;gap:3px;overflow:auto;width:100%;order:3}.nav-item{white-space:nowrap}.user-box{margin-right:auto;border:0;padding:0}.main{padding:18px 14px}.card{padding:16px}table{font-size:11.5px}}
</style>

<body><div id="app"></div>
<script>
(function(){
"use strict";
var firebaseConfig={apiKey:"AIzaSyCFI4CdRV6IwyjmifRjUlzzT_28I47vgh0",authDomain:"companyportal-f52e0.firebaseapp.com",projectId:"companyportal-f52e0",storageBucket:"companyportal-f52e0.firebasestorage.app",messagingSenderId:"314049949289",appId:"1:314049949289:web:889ca48f03540261f5fcf8"};
firebase.initializeApp(firebaseConfig);var db=firebase.firestore();

var ADMIN="admin@roshan.af", ADMINPASS="Roshan.af.admin@af&786";
var state={currentUser:null,users:[],bundles:[],complaints:[],rolls:[],reportResetAt:0,managerResets:{},section:null,loading:true,error:"",modal:null,unsubs:[],sessionToken:null,lastBundleIds:{},audioReady:false};

var MENUS={
 admin:[["managers","د منیجر یوزران"],["ntos","د NTO یوزران"],["sales","د پلور راپور"],["report","راپور"],["rolls","د شرکت مقررات"],["complaints","شکایتونه"]],
 manager:[["managers","د منیجر یوزران"],["ntos","د NTO یوزران"],["sales","د پلور راپور"],["report","راپور"]],
 nto:[["bundle","بنډل"],["sales","د پلور راپور"],["report","راپور"],["complaints","شکایتونه"]]
};
var ROLE={admin:"اډمین",manager:"منیجر",nto:"NTO"};

function getDoc(n){return db.collection("appdata").doc(n).get().then(function(s){return s.exists&&s.data().list?s.data().list:null}).catch(function(){return null})}
function setDoc(n,v){return db.collection("appdata").doc(n).set({list:v})}
function saveUsers(){return setDoc("users",state.users)}
function saveBundles(){return setDoc("bundles",state.bundles)}
function saveComplaints(){return setDoc("complaints",state.complaints)}
function saveRolls(){return setDoc("rolls",state.rolls)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(ts){var d=new Date(ts);return d.toLocaleDateString("en-GB")+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
function num(s){var m=String(s||"").match(/\d+(?:\.\d+)?/);return m?parseFloat(m[0]):0}
function statusLabel(s){return{s:"",pending:"په تمه (Pending)",in_process:"پروسیس کې",approved:"تصویب شوی",rejected:"ردشوی",resubmit:"بیا وړاندې شوی"}[s]||s}
function badge(s){var c={pending:"badge-pending",in_process:"badge-process",approved:"badge-approved",rejected:"badge-rejected",resubmit:"badge-resubmit",enabled:"badge-enabled",disabled:"badge-disabled"}[s]||"";return '<span class="badge '+c+'">'+esc(statusLabel(s))+"</span>"}
function toast(m){var x=document.createElement("div");x.className="toast";x.textContent=m;document.body.appendChild(x);setTimeout(function(){x.remove()},2700)}

function ensureSeed(){
 return getDoc("users").then(function(u){
  if(u&&u.length){state.users=u;var a=state.users.find(function(x){return x.role==="admin"});if(a&&a.username==="admin"){a.username=ADMIN;a.password=ADMINPASS;return saveUsers()}return}
  state.users=[{username:ADMIN,password:ADMINPASS,role:"admin",status:"enabled",createdBy:"system"}];return saveUsers();
 })
}
function loadAll(){
 return Promise.all([
  ensureSeed(),
  getDoc("bundles").then(function(v){state.bundles=v||[]}),
  getDoc("complaints").then(function(v){state.complaints=v||[]}),
  getDoc("rolls").then(function(v){state.rolls=v||[]}),
  db.collection("appdata").doc("reportMeta").get().then(function(s){if(s.exists){state.reportResetAt=s.data().resetAt||0;state.managerResets=s.data().managerResets||{}}})
 ])
}

function prepareAudio(){state.audioReady=true}
function notificationSound(){
 if(!state.audioReady)return;
 try{
  var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  var c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=740;o.type="sine";g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.22,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.52);
 }catch(e){}
}
function notifyNewBundle(){
 notificationSound();
 if("Notification"in window&&Notification.permission==="granted")try{new Notification("نوی بنډل",{body:"NTO نوی بنډل واستاوه."})}catch(e){}
}
function requestNotify(){
 if("Notification"in window&&Notification.permission==="default")Notification.requestPermission().catch(function(){});
}

function startSession(){
 if(state.currentUser.role!=="manager")return Promise.resolve();
 var token=uid();state.sessionToken=token;
 return db.collection("sessions").doc(state.currentUser.username).set({token:token,updatedAt:Date.now()}).catch(function(){});
}
function watchSession(){
 if(!state.currentUser||state.currentUser.role!=="manager")return;
 state.unsubs.push(db.collection("sessions").doc(state.currentUser.username).onSnapshot(function(s){
  if(s.exists&&s.data().token&&s.data().token!==state.sessionToken){
   state.currentUser=null;state.section=null;state.sessionToken=null;toast("دا حساب په بل ډیوایس کې Login شو؛ دا ډیوایس Logout شو.");render();
  }
 }));
}

function login(){
 var u=document.getElementById("li-user").value.trim(),p=document.getElementById("li-pass").value;
 if(!u||!p){state.error="مهرباني وکړئ یوزرنوم او پاسورډ دواړه ولیکئ.";render();return}
 var x=state.users.find(function(a){return a.username===u});
 if(!x||x.password!==p||x.status==="disabled"){state.error="یوزرنوم یا پاسورډ سم نه دی، یا حساب بند دی.";render();return}
 state.error="";state.currentUser={username:x.username,role:x.role};state.section=MENUS[x.role][0][0];prepareAudio();requestNotify();
 if(x.role==="manager")startSession().then(function(){render();watchSession()});else render();
}
function logout(){state.currentUser=null;state.section=null;state.sessionToken=null;render()}

function render(){
 var root=document.getElementById("app");
 if(state.loading){root.innerHTML='<div class="login-wrap"><div class="login-card"><p class="sub">بار کیږي...</p></div></div>';return}
 if(!state.currentUser)return loginView(root);
 var me=state.users.find(function(x){return x.username===state.currentUser.username});
 if(!me||me.status==="disabled"){root.innerHTML='<div class="blocked-wrap"><div class="blocked-card"><h3>ستاسو حساب بند شوی</h3><p>مهرباني وکړئ له اډمین یا منیجر سره اړیکه ونیسئ.</p><button class="btn btn-ghost" id="back">بیرته Login</button></div></div>';document.getElementById("back").onclick=logout;return}
 dashboard(root);
}
function loginView(root){
 root.innerHTML='<div class="login-wrap"><div class="login-card"><div class="login-brand"><div class="mark"></div><span>شرکت پورټال</span></div><p class="sub">دننه کیدو لپاره خپل یوزرنوم او پاسورډ ولیکئ</p>'+(state.error?'<div class="error-box">'+esc(state.error)+"</div>":"")+'<div class="field"><label>یوزرنوم</label><input id="li-user" autocomplete="username"></div><div class="field"><label>پاسورډ</label><input id="li-pass" type="password" autocomplete="current-password"></div><button class="btn btn-primary btn-block" id="li-btn">دننه شئ</button></div></div>';
 document.getElementById("li-btn").onclick=login;document.getElementById("li-pass").onkeydown=function(e){if(e.key==="Enter")login()}
}
function dashboard(root){
 var role=state.currentUser.role,menu=MENUS[role],pending=state.bundles.filter(function(b){return b.status==="pending"||b.status==="resubmit"}).length;
 var unseen=state.bundles.filter(function(b){return b.ntoUsername===state.currentUser.username&&!b.ntoSeen&&(b.status==="approved"||b.status==="rejected")}).length;
 root.innerHTML='<div class="shell"><aside class="sidebar"><div class="brand"><div class="mark"></div><b>شرکت پورټال</b></div><div class="role-tag">'+ROLE[role]+'</div><div class="nav">'+menu.map(function(m){var n=(m[0]==="sales"&&((role!=="nto"&&pending)|| (role==="nto"&&unseen)))?'<span class="nav-badge">'+(role==="nto"?unseen:pending)+"</span>":"";return'<div class="nav-item '+(state.section===m[0]?"active":"")+'" data-sec="'+m[0]+'"><span>'+m[1]+"</span>"+n+"</div>"}).join("")+'</div><div class="user-box"><div class="uname">'+esc(role==="manager"?state.currentUser.username:state.currentUser.username)+"</div><button class=\"btn btn-ghost btn-sm btn-block\" id=\"logout\">وتل (Logout)</button></div></aside><main class=\"main\"><div id=\"section\"></div></main></div>";
 document.querySelectorAll(".nav-item").forEach(function(x){x.onclick=function(){state.section=x.dataset.sec;if(role==="nto"&&state.section==="sales"){state.bundles.forEach(function(b){if(b.ntoUsername===state.currentUser.username&&(b.status==="approved"||b.status==="rejected"))b.ntoSeen=true});saveBundles()}render()}})
 document.getElementById("logout").onclick=logout;renderSection(document.getElementById("section"),role)
}

function title(k){return{bundle:"بنډل",managers:"د منیجر یوزران",ntos:"د NTO یوزران",sales:"د پلور راپور",report:"راپور",rolls:"د شرکت مقررات",complaints:"شکایتونه"}[k]||""}
function renderSection(el,role){
 el.innerHTML='<div class="main-header"><h2>'+title(state.section)+'</h2><div id="actions"></div></div><div id="body"></div>';
 var b=document.getElementById("body"),a=document.getElementById("actions");
 if(state.section==="bundle"&&role==="nto")return bundlePage(b);
 if(state.section==="managers"&&(role==="admin"||role==="manager"))return usersPage(b,"manager",role==="admin"||role==="manager");
 if(state.section==="ntos"&&(role==="admin"||role==="manager"))return usersPage(b,"nto",role==="admin"||role==="manager");
 if(state.section==="sales")return salesPage(b,role,a);
 if(state.section==="report")return reportPage(b,role,a);
 if(state.section==="rolls"&&role==="admin")return rollsPage(b);
 if(state.section==="complaints")return complaintsPage(b,role);
 b.innerHTML='<div class="card empty-state">لاسرسی نشته.</div>';
}

function bundlePage(b){
 var me=state.currentUser.username,rows=state.bundles.filter(function(x){return x.ntoUsername===me});
 b.innerHTML='<div class="card"><h4>نوی بنډل واستوئ</h4><div class="row"><div class="field"><label>شمیره</label><input id="bf1" inputmode="numeric"></div><div class="field"><label>د بنډل نوم</label><input id="bf2"></div><button class="btn btn-gold" id="bs">واستوئ</button></div></div><div class="card"><h4>ستاسو د بنډل تاریخچه</h4><div id="bl"></div></div>';
 document.getElementById("bf1").oninput=function(){this.value=this.value.replace(/\D/g,"").replace(/^0+(?=\d)/,"")};
 document.getElementById("bs").onclick=function(){
  var f1=document.getElementById("bf1").value.trim(),f2=document.getElementById("bf2").value.trim();if(!f1||!f2){toast("دواړه خانې ډکې کړئ.");return}
  var me=state.users.find(function(x){return x.username===state.currentUser.username});
  var e={id:uid(),ntoUsername:state.currentUser.username,managerUsername:me&&me.managerUsername||"",field1:f1,field2:f2,status:"pending",createdAt:Date.now(),comment:null,actionedBy:null,actionedAt:null,processingBy:null,ntoSeen:true};
  state.bundles.unshift(e);saveBundles().then(function(){toast("بنډل واستول شو.");render()})
 };
 document.getElementById("bl").innerHTML=rows.length?'<div style="overflow:auto"><table><tr><th>شمیره</th><th>بنډل</th><th>حالت</th><th>نیټه</th></tr>'+rows.map(function(x){return"<tr><td>"+esc(x.field1)+"</td><td>"+esc(x.field2)+"</td><td>"+badge(x.status)+"</td><td>"+fmt(x.createdAt)+"</td></tr>"}).join("")+"</table></div>":'<div class="empty-state">هیڅ بنډل نشته.</div>';
}

function usersPage(b,target,canDelete){
 var role=target==="manager"?"منیجر":"NTO",isNto=target==="nto",me=state.currentUser.username;
 var rows=state.users.filter(function(u){return u.role===target && (state.currentUser.role==="admin"||u.managerUsername===me||(!isNto&&state.currentUser.role==="manager"));});
 b.innerHTML='<div class="card"><h4>نوی '+role+' حساب جوړ کړئ</h4><div class="row"><div class="field"><label>یوزرنوم</label><input id="nu"></div><div class="field"><label>پاسورډ</label><input id="np" type="text"></div>'+(isNto?'<div class="field"><label>ادرس</label><input id="na"></div><div class="field"><label>اړیکې شمیره</label><input id="nc"></div>':'')+'<button class="btn btn-gold" id="create">جوړ کړئ</button></div></div><div class="card"><h4>د '+role+' حسابونه</h4><div id="ul"></div></div>';
 document.getElementById("create").onclick=function(){
  var u=document.getElementById("nu").value.trim(),p=document.getElementById("np").value.trim();if(!u||!p){toast("یوزرنوم او پاسورډ ولیکئ.");return}
  if(state.users.some(function(x){return x.username===u})){toast("دا یوزرنوم مخکې شتون لري.");return}
  var x={username:u,password:p,role:target,status:"enabled",createdBy:me};
  if(isNto){x.address=document.getElementById("na").value.trim();x.contact=document.getElementById("nc").value.trim();x.managerUsername=state.currentUser.role==="manager"?me:"";if(!x.address||!x.contact){toast("ادرس او اړیکې شمیره هم ولیکئ.");return}}
  if(target==="manager"&&state.currentUser.role==="manager"){toast("منیجر نشي کولی بل منیجر جوړ کړي.");return}
  state.users.push(x);saveUsers().then(function(){toast(role+" حساب جوړ شو.");render()})
 };
 document.getElementById("ul").innerHTML=rows.length?'<div style="overflow:auto"><table><tr><th>یوزرنوم</th>'+(isNto?"<th>ادرس</th><th>اړیکه</th><th>منیجر</th>":"")+'<th>حالت</th><th>عمل</th></tr>'+rows.map(function(x){return"<tr><td>"+esc(x.username)+"</td>"+(isNto?"<td>"+esc(x.address||"—")+"</td><td>"+esc(x.contact||"—")+"</td><td>"+esc(x.managerUsername||"—")+"</td>":"")+"<td>"+badge(x.status)+"</td><td><button class=\"btn btn-sm "+(x.status==="enabled"?"btn-danger":"btn-ok")+"\" data-toggle=\""+esc(x.username)+"\">"+(x.status==="enabled"?"ډیسیبل":"انیبل")+"</button> <button class=\"btn btn-sm btn-danger\" data-del=\""+esc(x.username)+"\">🗑️</button></td></tr>"}).join("")+"</table></div>":'<div class="empty-state">هیڅ حساب نشته.</div>';
 document.querySelectorAll("[data-toggle]").forEach(function(btn){btn.onclick=function(){var x=state.users.find(function(q){return q.username===btn.dataset.toggle});if(x){x.status=x.status==="enabled"?"disabled":"enabled";saveUsers().then(render)}}});
 document.querySelectorAll("[data-del]").forEach(function(btn){btn.onclick=function(){var uname=btn.dataset.del;if(!confirm("آیا دا یوزر حذف کړئ؟"))return;var x=state.users.find(function(q){return q.username===uname});if(!x)return;if(target==="nto"){state.bundles=state.bundles.filter(function(z){return z.ntoUsername!==uname})}state.users=state.users.filter(function(q){return q.username!==uname});Promise.all([saveUsers(),saveBundles()]).then(function(){toast("یوزر حذف شو.");render()})}});
}

function salesPage(b,role,a){
 var rows=role==="nto"?state.bundles.filter(function(x){return x.ntoUsername===state.currentUser.username}):state.bundles.filter(function(x){return role==="manager"?x.managerUsername===state.currentUser.username:true});
 a.innerHTML='<button class="icon-btn" id="salesExport" title="اکسیل ډاونلوډ">💾</button>'+(role==="manager"?'<button class="icon-btn" id="salesReset" title="ریسیټ">↻</button>':"");
 b.innerHTML=rows.length?'<div class="card"><div style="overflow:auto"><table><tr>'+(role!=="nto"?"<th>NTO</th>":"")+"<th>شمیره</th><th>بنډل</th><th>حالت</th>"+(role!=="nto"?"<th>عمل شوی له خوا</th>":"")+"<th>کمینټ</th><th>نیټه</th>"+(role==="nto"?"<th></th>":"")+"</tr>"+rows.map(function(x){var st=(role!=="nto"&&(x.status==="pending"||x.status==="resubmit"))?'<span class="badge clickable '+(x.status==="pending"?"badge-pending":"badge-resubmit")+'" data-proc="'+x.id+'">'+statusLabel(x.status)+"</span>":badge(x.status);return"<tr>"+(role!=="nto"?"<td>"+esc(x.ntoUsername)+"</td>":"")+"<td>"+esc(x.field1)+"</td><td>"+esc(x.field2)+"</td><td>"+st+"</td>"+(role!=="nto"?"<td>"+esc(x.actionedBy||"—")+"</td>":"")+"<td>"+esc(x.comment||"—")+"</td><td>"+fmt(x.createdAt)+"</td>"+(role==="nto"?"<td>"+(x.status==="rejected"?'<button class="btn btn-sm btn-info" data-resub="'+x.id+'">ریسبمیټ</button>':"")+"</td>":"")+"</tr>"}).join("")+"</table></div></div>":'<div class="card empty-state">هیڅ معلومات نشته.</div>';
 document.querySelectorAll("[data-proc]").forEach(function(x){x.onclick=function(){openProcess(x.dataset.proc)}});
 document.querySelectorAll("[data-resub]").forEach(function(x){x.onclick=function(){openResubmit(x.dataset.resub)}});
 document.getElementById("salesExport").onclick=function(){exportRows(rows,"Sales-Report")};
 if(role==="manager")document.getElementById("salesReset").onclick=managerReset;
}
function exportRows(rows,name){
 if(!rows.length){toast("هیڅ معلومات نشته.");return}
 var data=rows.map(function(x){return{"NTO":x.ntoUsername,"شمیره":x.field1,"بنډل":x.field2,"حالت":statusLabel(x.status),"کمینټ":x.comment||"","نیټه":fmt(x.createdAt)}});
 var ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Report");XLSX.writeFile(wb,name+"-"+Date.now()+".xlsx");
}

function openProcess(id){
 var x=state.bundles.find(function(q){return q.id===id});if(!x||(x.status!=="pending"&&x.status!=="resubmit"))return;
 x.status="in_process";x.processingBy=state.currentUser.username;saveBundles().then(function(){state.modal={type:"process",id:id};render()})
}
function decision(d){
 var x=state.bundles.find(function(q){return q.id===state.modal.id}),c=document.getElementById("pc").value.trim();if(!c){toast("کمینټ اړین دی.");return}
 x.status=d;x.comment=c;x.actionedBy=state.currentUser.username;x.actionedAt=Date.now();x.processingBy=null;x.ntoSeen=false;saveBundles().then(function(){state.modal=null;toast(d==="approved"?"بنډل تصویب شو.":"بنډل رد شو.");render()})
}
function openResubmit(id){state.modal={type:"resubmit",id:id};render()}
function doResubmit(){var x=state.bundles.find(function(q){return q.id===state.modal.id}),c=document.getElementById("rc").value.trim();if(!c){toast("کمینټ ولیکئ.");return}x.status="resubmit";x.comment=c;x.actionedBy=null;x.actionedAt=null;x.processingBy=null;x.ntoSeen=true;saveBundles().then(function(){state.modal=null;toast("بیا وړاندې شو.");render()})}
function modal(){
 if(!state.modal)return;var l=document.createElement("div");l.className="modal-backdrop";
 l.innerHTML=state.modal.type==="process"?'<div class="modal-card"><h3>د بنډل پروسس</h3><div class="field"><label>کمینټ (اړین)</label><textarea id="pc" rows="3"></textarea></div><div class="modal-actions"><button class="btn btn-ok" id="pa">تصویب</button><button class="btn btn-danger" id="pr">ردول</button></div><button class="btn btn-ghost btn-block" id="px" style="margin-top:10px">لغوه</button></div>':'<div class="modal-card"><h3>بیا وړاندې کول</h3><div class="field"><label>کمینټ</label><textarea id="rc" rows="3"></textarea></div><button class="btn btn-gold btn-block" id="rs">ریسبمیټ</button><button class="btn btn-ghost btn-block" id="rx" style="margin-top:10px">لغوه</button></div>';
 document.body.appendChild(l);
 if(state.modal.type==="process"){document.getElementById("pa").onclick=function(){decision("approved")};document.getElementById("pr").onclick=function(){decision("rejected")};document.getElementById("px").onclick=function(){state.modal=null;render()}}else{document.getElementById("rs").onclick=doResubmit;document.getElementById("rx").onclick=function(){state.modal=null;render()}}
}
function managerReportRows(){
 var me=state.currentUser.username,reset=state.managerResets[me]||0,rows={};
 state.bundles.forEach(function(x){if(x.managerUsername===me&&x.status==="approved"&&x.actionedBy===me&&x.actionedAt>reset){if(!rows[x.ntoUsername])rows[x.ntoUsername]={nto:x.ntoUsername,count:0,total:0};rows[x.ntoUsername].count++;rows[x.ntoUsername].total+=num(x.comment)}});return Object.keys(rows).map(function(k){return rows[k]})
}
function reportPage(b,role,a){
 if(role==="nto"){var total=0,count=0;state.bundles.forEach(function(x){if(x.ntoUsername===state.currentUser.username&&x.status==="approved"&&x.actionedAt>state.reportResetAt){total+=num(x.comment);count++}});b.innerHTML='<div class="card"><h4>ستاسو مجموعه راپور</h4><div style="font-size:28px;font-weight:800;color:var(--ok)">'+total.toLocaleString()+" افغانۍ</div><div class=\"note-text\">د تصویب شویو شمیر: "+count+"</div></div>";return}
 if(role==="manager"){
  var rows=managerReportRows(),t=rows.reduce(function(s,x){return s+x.total},0),c=rows.reduce(function(s,x){return s+x.count},0);
  b.innerHTML='<div class="card"><h4>ستاسو مجموعه راپور</h4><div style="font-size:28px;font-weight:800;color:var(--ok)">'+t.toLocaleString()+" افغانۍ</div><div class=\"note-text\">د تصویب شویو شمیر: "+c+"</div></div>";
  return
 }
 var managers=state.users.filter(function(x){return x.role==="manager"}),html='<div class="card"><div style="overflow:auto"><table><tr><th>د منیجر نوم</th><th>اپروب شوو شمیرې تعداد</th><th>مجموعه</th><th>Reset</th></tr>';
 managers.forEach(function(m){var reset=state.managerResets[m.username]||0,total=0,count=0;state.bundles.forEach(function(x){if(x.actionedBy===m.username&&x.status==="approved"&&x.actionedAt>reset){count++;total+=num(x.comment)}});html+='<tr><td>'+esc(m.username)+'</td><td>'+count+'</td><td>'+total.toLocaleString()+" افغانۍ</td><td><button class=\"icon-btn\" data-mreset=\""+esc(m.username)+"\">↻</button></td></tr>"});b.innerHTML=html+"</table></div></div>";
 managers.forEach(function(m){var q=document.querySelector('[data-mreset="'+CSS.escape(m.username)+'"]');if(q)q.onclick=function(){if(!confirm("د "+m.username+" راپور Reset شي؟"))return;state.managerResets[m.username]=Date.now();db.collection("appdata").doc("reportMeta").set({resetAt:state.reportResetAt,managerResets:state.managerResets}).then(render)}})
}
function managerReset(){
 if(!confirm("د همدې منیجر ټول Sales/Bundle معلومات Reset شي؟"))return;
 var me=state.currentUser.username;
 state.bundles=state.bundles.filter(function(x){return x.managerUsername!==me});
 state.managerResets[me]=Date.now();
 Promise.all([saveBundles(),db.collection("appdata").doc("reportMeta").set({resetAt:state.reportResetAt,managerResets:state.managerResets})]).then(function(){toast("د همدې منیجر معلومات Reset شول.");render()})
}
function rollsPage(b){b.innerHTML='<div class="card"><h4>نوی مقرره</h4><div class="row"><div class="field"><textarea id="rt" rows="3"></textarea></div><button class="btn btn-gold" id="ra">اضافه کړئ</button></div></div><div class="card"><h4>مقررات</h4>'+state.rolls.map(function(x){return'<div style="padding:12px 0;border-bottom:1px solid var(--border)">'+esc(x.text)+'<div class="note-text">'+fmt(x.createdAt)+"</div></div>"}).join("")+"</div>";document.getElementById("ra").onclick=function(){var t=document.getElementById("rt").value.trim();if(!t)return;state.rolls.unshift({id:uid(),text:t,createdAt:Date.now(),createdBy:state.currentUser.username});saveRolls().then(render)}}
function complaintsPage(b,role){var rows=role==="nto"?state.complaints.filter(function(x){return x.fromUsername===state.currentUser.username}):state.complaints;b.innerHTML=(role==="nto"?'<div class="card"><h4>نوی شکایت</h4><div class="row"><div class="field"><textarea id="ct" rows="3"></textarea></div><button class="btn btn-gold" id="ca">واستوئ</button></div></div>':"")+'<div class="card"><h4>شکایتونه</h4>'+rows.map(function(x){return'<div style="padding:12px 0;border-bottom:1px solid var(--border)">'+(role!=="nto"?"له: "+esc(x.fromUsername)+"<br>":"")+esc(x.text)+'<div class="note-text">'+fmt(x.createdAt)+"</div></div>"}).join("")+"</div>";if(role==="nto")document.getElementById("ca").onclick=function(){var t=document.getElementById("ct").value.trim();if(!t)return;state.complaints.unshift({id:uid(),fromUsername:state.currentUser.username,text:t,createdAt:Date.now()});saveComplaints().then(render)}}

function attach(){
 state.unsubs.forEach(function(u){try{u()}catch(e){}});state.unsubs=[];
 state.unsubs.push(db.collection("appdata").doc("users").onSnapshot(function(s){if(s.exists){state.users=s.data().list||[];render()}}));
 state.unsubs.push(db.collection("appdata").doc("bundles").onSnapshot(function(s){
  if(s.exists){var n=s.data().list||[],old=state.bundles.map(function(x){return x.id});if(state.currentUser&&state.currentUser.role==="manager"){var fresh=n.filter(function(x){return x.managerUsername===state.currentUser.username&&x.status==="pending"}).some(function(x){return old.indexOf(x.id)<0});if(fresh)notifyNewBundle()}state.bundles=n;render()}
 }));
 state.unsubs.push(db.collection("appdata").doc("complaints").onSnapshot(function(s){if(s.exists){state.complaints=s.data().list||[];render()}}));
 state.unsubs.push(db.collection("appdata").doc("rolls").onSnapshot(function(s){if(s.exists){state.rolls=s.data().list||[];render()}}));
 state.unsubs.push(db.collection("appdata").doc("reportMeta").onSnapshot(function(s){if(s.exists){state.reportResetAt=s.data().resetAt||0;state.managerResets=s.data().managerResets||{};render()}}));
}
loadAll().then(function(){state.loading=false;attach();render()});
setInterval(function(){if(state.currentUser&&state.currentUser.role==="manager")watchSession()},10000);
var oldRender=render;render=function(){oldRender();var o=document.getElementById("modal-layer");if(o)o.remove();if(state.modal){modal()}};
})();
</script>
</body>
</html>
